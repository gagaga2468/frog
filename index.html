<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>欢迎</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f6f7fb;
        color: #1e1f24;
      }
      .card {
        background: #ffffff;
        padding: 32px 40px;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
        text-align: center;
      }
      .card h1 {
        margin: 0 0 12px;
        font-size: 1.8rem;
      }
      .card p {
        margin: 0;
        color: #6b7280;
      }
      .card a {
        display: inline-block;
        margin-top: 16px;
        color: #f7931a;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>欢迎来到主页</h1>
      <p>点击下方链接查看比特币贪婪恐慌指数仪表盘。</p>
      <a href="app.html">进入仪表盘</a>
    </main>
  </body>
</html>
